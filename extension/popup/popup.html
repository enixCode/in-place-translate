<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --border: rgba(0, 0, 0, .1);
      --accent: #0071e3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --text: #f5f5f7;
        --muted: #9a9a9e;
        --border: rgba(255, 255, 255, .12);
        --accent: #0a84ff;
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      width: 220px;
      padding: 14px;
      background: var(--bg);
      color: var(--text);
    }
    label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-weight: 500;
    }
    input[type="checkbox"] {
      width: 34px;
      height: 20px;
      appearance: none;
      background: var(--border);
      border-radius: 999px;
      position: relative;
      cursor: pointer;
      outline: none;
      transition: background-color .15s ease;
    }
    input[type="checkbox"]::before {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: transform .15s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
    }
    input[type="checkbox"]:checked {
      background: var(--accent);
    }
    input[type="checkbox"]:checked::before {
      transform: translateX(14px);
    }
    #targetLangDisplay {
      color: var(--muted);
      padding: 6px 0;
      border-top: 1px solid var(--border);
      margin-top: 4px;
    }
    #siteAccessStatus {
      display: block;
      color: var(--muted);
      padding: 6px 0;
      border-top: 1px solid var(--border);
    }
    #grantAccess {
      width: 100%;
      margin-top: 2px;
      padding: 7px 10px;
      border: 0;
      border-radius: 7px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
    }
    #grantAccess[hidden] { display: none; }
    a {
      display: block;
      margin-top: 8px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <label>
    <span id="labelEnabled"></span>
    <input type="checkbox" id="enabled">
  </label>
  <div id="targetLangDisplay"></div>
  <span id="siteAccessStatus"></span>
  <button type="button" id="grantAccess" hidden></button>
  <a href="#" id="openOptions"></a>
  <script src="popup.js"></script>
</body>
</html>
