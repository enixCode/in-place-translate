<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>In-Place Translator</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --border: rgba(0, 0, 0, .1);
      --accent: #0071e3;
      --accent-hover: #0077ed;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --card: #2c2c2e;
        --text: #f5f5f7;
        --muted: #9a9a9e;
        --border: rgba(255, 255, 255, .12);
        --accent: #0a84ff;
        --accent-hover: #379dff;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 440px;
      margin: 32px auto;
      padding: 0 20px 20px;
      background: var(--bg);
      color: var(--text);
    }
    h1 {
      font-size: 17px;
      font-weight: 600;
      margin: 0 0 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }
    label { display: block; margin-bottom: 18px; }
    label:last-of-type { margin-bottom: 0; }
    label span { display: block; font-weight: 500; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
    input[type="password"], input[type="text"], select {
      width: 100%;
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color .12s ease, box-shadow .12s ease;
    }
    input[type="password"]:focus, input[type="text"]:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
    }
    .row { display: flex; gap: 8px; align-items: center; }
    .row input { flex: 1; }
    button {
      padding: 8px 16px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color .12s ease;
    }
    button:hover { background: var(--accent-hover); }
    button:active { opacity: .85; }
    #toggleApiKey {
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
    }
    #toggleApiKey:hover { background: var(--border); }
    p { margin: 8px 0 20px; }
    a { color: var(--accent); font-size: 12.5px; text-decoration: none; }
    a:hover { text-decoration: underline; }
    #status { margin-left: 8px; font-size: 12.5px; color: var(--muted); }
  </style>
</head>
<body>
  <h1 id="title"></h1>
  <div class="card">
    <label>
      <span id="labelApiKey"></span>
      <div class="row">
        <input type="password" id="apiKey" autocomplete="off">
        <button type="button" id="toggleApiKey"></button>
      </div>
    </label>
    <p><a id="linkGetKey" href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener"></a></p>
    <label>
      <span id="labelModel"></span>
      <select id="model">
        <option value="claude-haiku-4-5">Claude Haiku 4.5</option>
        <option value="claude-sonnet-5">Claude Sonnet 5</option>
        <option value="claude-opus-5">Claude Opus 5</option>
      </select>
    </label>
    <label>
      <span id="labelTargetLang"></span>
      <select id="targetLang">
        <option value="fr">Français</option>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="de">Deutsch</option>
        <option value="it">Italiano</option>
        <option value="pt">Português</option>
        <option value="nl">Nederlands</option>
        <option value="pl">Polski</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="zh">中文</option>
        <option value="ar">العربية</option>
        <option value="ru">Русский</option>
      </select>
    </label>
    <div class="row" style="margin-top: 20px;">
      <button type="button" id="save"></button>
      <button type="button" id="test"></button>
      <span id="status"></span>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
